[supervisord]
user=root
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/maple/supervisor.pid
childlogdir=/run/maple

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1440x1000x24 -nolisten tcp -ac
user=node
priority=10
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:window-manager]
command=/usr/bin/openbox
user=node
priority=20
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:vnc]
command=/usr/bin/x11vnc -display :99 -rfbport 5900 -localhost -passwdfile /run/maple/vnc-password -forever -shared -quiet
user=node
priority=30
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 7900 localhost:5900
user=node
priority=40
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:maple]
command=/bin/sh -c 'until xdpyinfo -display :99 >/dev/null 2>&1; do sleep 1; done; exec node /app/src/docker-server.mjs'
directory=/app
user=node
priority=50
autorestart=unexpected
startsecs=5
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
