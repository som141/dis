# Optional managed-cloud proxy trust. Normal Linux/Windows users omit this file.
services:
  maple-desktop:
    build:
      secrets:
        - proxy_ca
    environment:
      NODE_EXTRA_CA_CERTS: /run/secrets/proxy_ca
    secrets:
      - proxy_ca
secrets:
  proxy_ca:
    file: ${CODEX_PROXY_CERT:?The managed environment must provide CODEX_PROXY_CERT}
