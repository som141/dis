name: maple-prototype
services:
  maple-desktop:
    hostname: maple-desktop
    image: dis-maple-prototype:local
    build:
      context: .
    ports:
      - "127.0.0.1:${MAPLE_DESKTOP_PORT:-17900}:7900"
    shm_size: 1gb
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - browser-profile:/home/node/browser-profile
      - character-cache:/home/node/maple-data
    secrets:
      - vnc_password
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
secrets:
  vnc_password:
    file: ./.docker-secrets/vnc-password
volumes:
  browser-profile:
  character-cache:
