events {}
http {
    server {
        listen 80;
        server_name _;
        client_max_body_size 1m;

        location ^~ /internal/ {
            return 404;
        }

        location = /maple/connect {
            proxy_pass http://gateway:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /maple/oauth/callback {
            proxy_pass http://gateway:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / {
            proxy_pass http://maple-portal:8878;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }
    }
}
