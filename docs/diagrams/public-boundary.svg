<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="535" viewBox="0 0 1400 535" role="img" aria-label="공개 HTTPS 진입점과 내부 API 및 관리 포트의 경계">
<title>공개 HTTPS 진입점과 내부 API 및 관리 포트의 경계</title><defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#748699"/></marker>
<marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8" fill="#748699"/></marker>
<style>text{font-family:'Malgun Gothic','Noto Sans CJK KR',Arial,sans-serif;fill:#203247} .title{font-size:22px;font-weight:700} .sub{font-size:17px} .label{font-size:16px} .heading{font-size:16px;font-weight:700;fill:#64758a;letter-spacing:1px}</style>
</defs><rect width="1400" height="535" fill="white"/><text x="30" y="30" class="heading">공개 요청 → 신뢰한 프록시 → 인증·소유권 검사 → 내부 데이터</text><rect x="30" y="80" width="220" height="100" rx="12" fill="#f5f7fa" stroke="#8895a2" stroke-width="1.8"/><text x="48" y="109" class="title">웹 사용자</text><text x="48" y="134" class="sub">공개 HTTPS 요청</text><rect x="315" y="80" width="280" height="100" rx="12" fill="#f0ecfa" stroke="#8570b1" stroke-width="1.8"/><text x="333" y="109" class="title">TLS 프록시 / 터널</text><text x="333" y="134" class="sub">Host·scheme 전달</text><text x="333" y="156" class="sub">호스트 loopback / 내부망</text><rect x="660" y="80" width="245" height="100" rx="12" fill="#f0ecfa" stroke="#8570b1" stroke-width="1.8"/><text x="678" y="109" class="title">maple-edge</text><text x="678" y="134" class="sub">공개 웹 라우팅</text><text x="678" y="156" class="sub">/internal/ → 404</text><path d="M250 130 H315" fill="none" stroke="#748699" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="244.5" y="101" width="75" height="23" rx="5" fill="white"/><text x="282" y="117" text-anchor="middle" class="label">HTTPS</text><path d="M595 130 H660" fill="none" stroke="#748699" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="995" y="40" width="360" height="100" rx="12" fill="#eef5ff" stroke="#497cac" stroke-width="1.8"/><text x="1013" y="69" class="title">Gateway</text><text x="1013" y="94" class="sub">/maple/connect · OAuth callback</text><text x="1013" y="116" class="sub">서명·만료·Discord 신원 일치</text><rect x="995" y="215" width="360" height="100" rx="12" fill="#fff5e4" stroke="#b68436" stroke-width="1.8"/><text x="1013" y="244" class="title">Maple Portal</text><text x="1013" y="269" class="sub">세션·Origin·CSRF·소유권 검사</text><text x="1013" y="291" class="sub">Gateway 내부 API는 별도 키 인증</text><path d="M905 110 H945 V90 H995" fill="none" stroke="#748699" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M905 150 H945 V265 H995" fill="none" stroke="#748699" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M1180 140 V215" fill="none" stroke="#748699" stroke-width="2.2" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="1134.5" y="168" width="91" height="23" rx="5" fill="white"/><text x="1180" y="184" text-anchor="middle" class="label">내부 HTTP</text><rect x="30" y="370" width="1325" height="140" rx="12" fill="#f7f9fb" stroke="#b5c2cf"/><text x="50" y="402" class="title">운영자 전용 · 기본 호스트 loopback</text><text x="50" y="438" class="sub">DB · Redis · RabbitMQ · Actuator · Grafana · Prometheus · Loki · Alloy · exporters</text><text x="50" y="473" class="sub">공개 웹 라우팅 없음. 원격 점검은 인증된 SSH 포트 전달 등으로 접근. 실제 방화벽·계정 권한은 별도 확인.</text></svg>
