services:
  redis:
    image: redis:7-alpine
    ports:
      - "${INFRA_BIND:-127.0.0.1}:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "${INFRA_BIND:-127.0.0.1}:5672:5672"
      - "${INFRA_BIND:-127.0.0.1}:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    command:
      - /bin/sh
      - -ec
      - |
        rabbitmq-plugins enable --offline rabbitmq_prometheus
        exec rabbitmq-server
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    ports:
      - "${INFRA_BIND:-127.0.0.1}:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock}
      POSTGRES_USER: ${POSTGRES_USER:-stock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stock} -d ${POSTGRES_DB:-stock}"]
      interval: 5s
      timeout: 5s
      retries: 20

  maple-db-bootstrap:
    profiles: ["maple"]
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock}
      POSTGRES_USER: ${POSTGRES_USER:-stock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock}
      MAPLE_POSTGRES_PASSWORD: ${MAPLE_POSTGRES_PASSWORD:-}
    volumes:
      - ./ops/maple-db/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    restart: "no"

  maple-db-migrate:
    profiles: ["maple"]
    image: flyway/flyway:13.12.0
    depends_on:
      maple-db-bootstrap:
        condition: service_completed_successfully
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-stock}
      FLYWAY_USER: maple_app
      FLYWAY_PASSWORD: ${MAPLE_POSTGRES_PASSWORD:-}
      FLYWAY_SCHEMAS: maple
      FLYWAY_DEFAULT_SCHEMA: maple
      FLYWAY_CONNECT_RETRIES: 30
    volumes:
      - ./ops/maple-db/migrations:/flyway/sql:ro
    command: ["migrate"]
    restart: "no"

  maple-db-import:
    profiles: ["maple"]
    build:
      context: ./apps/maple-portal
      target: portal
    image: ${MAPLE_PORTAL_IMAGE_NAME:-dis-maple-portal}:${MAPLE_PORTAL_IMAGE_TAG:-local}
    depends_on:
      maple-db-migrate:
        condition: service_completed_successfully
    environment:
      MAPLE_PORTAL_DATA: /home/node/portal-data
      MAPLE_PORTAL_USERS: ${MAPLE_PORTAL_USERS:-2}
      MAPLE_POSTGRES_HOST: postgres
      MAPLE_POSTGRES_PORT: 5432
      MAPLE_POSTGRES_DB: ${POSTGRES_DB:-stock}
      MAPLE_POSTGRES_USER: maple_app
      MAPLE_POSTGRES_PASSWORD: ${MAPLE_POSTGRES_PASSWORD:-}
    volumes:
      - maple-portal-data:/home/node/portal-data:ro
    entrypoint: ["node", "/app/scripts/import-portal-json.mjs"]
    restart: "no"

  youtube-cipher:
    build:
      context: .
      dockerfile: ops/youtube-cipher/Dockerfile
    image: ${YOUTUBE_CIPHER_IMAGE_NAME:-discord-youtube-cipher}:${YOUTUBE_CIPHER_IMAGE_TAG:-local}
    environment:
      API_TOKEN: ${YOUTUBE_REMOTE_CIPHER_PASSWORD:-}
      OVERRIDE_PLAYER_VARIANT: IAS
      MAX_THREADS: ${YOUTUBE_CIPHER_MAX_THREADS:-1}
      XDG_CACHE_HOME: /app/player_cache
    volumes:
      - youtube-cipher-cache:/app/player_cache
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: apps/gateway-app/Dockerfile
    image: ${GATEWAY_IMAGE_NAME:-discord-gateway}:${GATEWAY_IMAGE_TAG:-local}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      youtube-cipher:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ""
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_DEV_GUILD_ID: ${DISCORD_DEV_GUILD_ID:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      YOUTUBE_OAUTH_INIT: ${YOUTUBE_OAUTH_INIT:-false}
      YOUTUBE_PO_TOKEN: ${YOUTUBE_PO_TOKEN:-}
      YOUTUBE_VISITOR_DATA: ${YOUTUBE_VISITOR_DATA:-}
      YOUTUBE_REMOTE_CIPHER_URL: ${YOUTUBE_REMOTE_CIPHER_URL:-http://youtube-cipher:8001}
      YOUTUBE_REMOTE_CIPHER_PASSWORD: ${YOUTUBE_REMOTE_CIPHER_PASSWORD:-}
      YOUTUBE_REMOTE_CIPHER_USER_AGENT: ${YOUTUBE_REMOTE_CIPHER_USER_AGENT:-dis-bot}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      APP_NODE_NAME: gateway-1
      HEALTH_PORT: 8080
      MAPLE_DISCORD_ENABLED: ${MAPLE_DISCORD_ENABLED:-false}
      MAPLE_PUBLIC_BASE_URL: ${MAPLE_PUBLIC_BASE_URL:-}
      MAPLE_DISCORD_CLIENT_ID: ${MAPLE_DISCORD_CLIENT_ID:-}
      MAPLE_DISCORD_CLIENT_SECRET: ${MAPLE_DISCORD_CLIENT_SECRET:-}
      MAPLE_DISCORD_REDIRECT_URI: ${MAPLE_DISCORD_REDIRECT_URI:-}
      MAPLE_LINK_SIGNING_KEY: ${MAPLE_LINK_SIGNING_KEY:-}
      MAPLE_PORTAL_INTERNAL_URL: http://maple-portal:8878
      MAPLE_DISCORD_INTERNAL_KEY: ${MAPLE_DISCORD_INTERNAL_KEY:-}
    ports:
      - "${INFRA_BIND:-127.0.0.1}:8081:8080"
    restart: unless-stopped

  maple-portal:
    profiles: ["maple"]
    depends_on:
      maple-db-import:
        condition: service_completed_successfully
    build:
      context: ./apps/maple-portal
      target: portal
    image: ${MAPLE_PORTAL_IMAGE_NAME:-dis-maple-portal}:${MAPLE_PORTAL_IMAGE_TAG:-local}
    environment:
      MAPLE_PORTAL_BIND: 0.0.0.0
      MAPLE_PORTAL_PORT: 8878
      MAPLE_PORTAL_ORIGIN: ${MAPLE_PUBLIC_BASE_URL:-http://127.0.0.1:18877}
      MAPLE_PORTAL_DATA: /home/node/portal-data
      MAPLE_SERVICE_KEY_FILE: /run/secrets/maple_nexon_service_key
      MAPLE_PORTAL_USERS: ${MAPLE_PORTAL_USERS:-2}
      MAPLE_DISCORD_MODE: "true"
      MAPLE_DISCORD_INTERNAL_KEY: ${MAPLE_DISCORD_INTERNAL_KEY:-}
      MAPLE_REQUIRE_POSTGRES: "true"
      MAPLE_POSTGRES_HOST: postgres
      MAPLE_POSTGRES_PORT: 5432
      MAPLE_POSTGRES_DB: ${POSTGRES_DB:-stock}
      MAPLE_POSTGRES_USER: maple_app
      MAPLE_POSTGRES_PASSWORD: ${MAPLE_POSTGRES_PASSWORD:-}
    secrets:
      - maple_nexon_service_key
    volumes:
      - maple-portal-data:/home/node/portal-data
      - maple-portal-cache:/home/node/maple-data
    shm_size: 1gb
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  maple-edge:
    profiles: ["maple"]
    image: nginx:1.27-alpine
    ports:
      - "${MAPLE_EDGE_BIND:-127.0.0.1}:${MAPLE_EDGE_PORT:-18877}:80"
    volumes:
      - ./ops/maple-edge/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - maple-portal
    restart: unless-stopped

  audio-node:
    build:
      context: .
      dockerfile: apps/audio-node-app/Dockerfile
    image: ${AUDIO_NODE_IMAGE_NAME:-discord-audio-node}:${AUDIO_NODE_IMAGE_TAG:-local}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      youtube-cipher:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ""
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_DEV_GUILD_ID: ${DISCORD_DEV_GUILD_ID:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      YOUTUBE_OAUTH_INIT: ${YOUTUBE_OAUTH_INIT:-false}
      YOUTUBE_PO_TOKEN: ${YOUTUBE_PO_TOKEN:-}
      YOUTUBE_VISITOR_DATA: ${YOUTUBE_VISITOR_DATA:-}
      YOUTUBE_REMOTE_CIPHER_URL: ${YOUTUBE_REMOTE_CIPHER_URL:-http://youtube-cipher:8001}
      YOUTUBE_REMOTE_CIPHER_PASSWORD: ${YOUTUBE_REMOTE_CIPHER_PASSWORD:-}
      YOUTUBE_REMOTE_CIPHER_USER_AGENT: ${YOUTUBE_REMOTE_CIPHER_USER_AGENT:-dis-bot}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      APP_NODE_NAME: audio-node-1
      HEALTH_PORT: 8080
    ports:
      - "${INFRA_BIND:-127.0.0.1}:8082:8080"
    restart: unless-stopped

  stock-node:
    build:
      context: .
      dockerfile: apps/stock-node-app/Dockerfile
    image: ${STOCK_NODE_IMAGE_NAME:-discord-stock-node}:${STOCK_NODE_IMAGE_TAG:-local}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-stock}
      POSTGRES_USER: ${POSTGRES_USER:-stock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock}
      STOCK_QUOTE_PROVIDER: ${STOCK_QUOTE_PROVIDER:-mock}
      STOCK_QUOTE_CACHE_TTL: ${STOCK_QUOTE_CACHE_TTL:-60s}
      STOCK_QUOTE_FRESHNESS: ${STOCK_QUOTE_FRESHNESS:-45s}
      STOCK_QUOTE_TRADE_FRESHNESS: ${STOCK_QUOTE_TRADE_FRESHNESS:-45s}
      STOCK_PROVIDER_PER_MINUTE_LIMIT: ${STOCK_PROVIDER_PER_MINUTE_LIMIT:-60}
      STOCK_PROVIDER_PER_DAY_LIMIT: ${STOCK_PROVIDER_PER_DAY_LIMIT:-100000}
      STOCK_MARKET_DATA_ENABLED: ${STOCK_MARKET_DATA_ENABLED:-true}
      STOCK_MARKET: ${STOCK_MARKET:-US}
      STOCK_MARKET_REFRESH_DELAY_MS: ${STOCK_MARKET_REFRESH_DELAY_MS:-20000}
      STOCK_TOP_RANK_LIMIT: ${STOCK_TOP_RANK_LIMIT:-10}
      FINNHUB_BASE_URL: ${FINNHUB_BASE_URL:-https://finnhub.io/api/v1}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      APP_NODE_NAME: stock-node-1
      HEALTH_PORT: 8080
    ports:
      - "${INFRA_BIND:-127.0.0.1}:8083:8080"
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      gateway:
        condition: service_started
      audio-node:
        condition: service_started
      stock-node:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
    restart: unless-stopped

  loki:
    profiles: ["observability"]
    image: ${LOKI_IMAGE:-grafana/loki:latest}
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - ./ops/observability/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  alloy:
    profiles: ["observability"]
    image: ${ALLOY_IMAGE:-grafana/alloy:latest}
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./ops/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy-data:/var/lib/alloy/data
    ports:
      - "12345:12345"
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  redis-exporter:
    profiles: ["observability"]
    image: ${REDIS_EXPORTER_IMAGE:-oliver006/redis_exporter:latest}
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter:
    profiles: ["observability"]
    image: ${POSTGRES_EXPORTER_IMAGE:-prometheuscommunity/postgres-exporter:latest}
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-stock}:${POSTGRES_PASSWORD:-stock}@postgres:5432/${POSTGRES_DB:-stock}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-false}
      GRAFANA_ALERT_DEFAULT_RECEIVER: ${GRAFANA_ALERT_DEFAULT_RECEIVER:-observability-noop}
      GRAFANA_ALERT_NOOP_WEBHOOK_URL: ${GRAFANA_ALERT_NOOP_WEBHOOK_URL:-http://127.0.0.1:9/disabled}
      GRAFANA_ALERT_DISCORD_WEBHOOK_URL: ${GRAFANA_ALERT_DISCORD_WEBHOOK_URL:-https://example.invalid/discord-webhook}
      GRAFANA_ALERT_DISCORD_AVATAR_URL: ${GRAFANA_ALERT_DISCORD_AVATAR_URL:-}
      GRAFANA_ALERT_DISCORD_USE_USERNAME: ${GRAFANA_ALERT_DISCORD_USE_USERNAME:-true}
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped

secrets:
  maple_nexon_service_key:
    file: ./apps/maple-portal/.docker-secrets/nexon-service-key

volumes:
  redis-data:
  rabbitmq-data:
  youtube-cipher-cache:
  postgres-data:
  prometheus-data:
  loki-data:
  grafana-data:
  alloy-data:
  maple-portal-data:
  maple-portal-cache:
