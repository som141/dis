name: Test Maple PostgreSQL migration

on:
  pull_request:
    paths:
      - 'apps/maple-portal/**'
      - 'ops/maple-db/**'
      - 'docker-compose.yml'
      - '.github/workflows/maple-postgres-test.yml'
  push:
    branches: [main]
    paths:
      - 'apps/maple-portal/**'
      - 'ops/maple-db/**'
      - 'docker-compose.yml'

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: maple_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d maple_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MAPLE_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/maple_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/maple-portal/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/maple-portal
      - run: node scripts/prepare-postgres-test.mjs
        working-directory: apps/maple-portal
      - run: npm test
        working-directory: apps/maple-portal
      - run: node ops/maple-db/check-doc-links.mjs
