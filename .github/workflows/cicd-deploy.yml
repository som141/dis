name: Build Bot Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dis-release-main
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      GATEWAY_IMAGE_NAME: discord-gateway
      AUDIO_NODE_IMAGE_NAME: discord-audio-node
      STOCK_NODE_IMAGE_NAME: discord-stock-node
      YOUTUBE_CIPHER_IMAGE_NAME: discord-youtube-cipher
      MAPLE_PORTAL_IMAGE_NAME: dis-maple-portal

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test and build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean test bootJarAll --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/test/**
            **/build/test-results/test/**
          if-no-files-found: ignore

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/maple-portal/package-lock.json

      - name: Test Maple portal
        working-directory: apps/maple-portal
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Build Docker images
        run: |
          docker build -f apps/gateway-app/Dockerfile -t "${GATEWAY_IMAGE_NAME}:${GITHUB_SHA}" .
          docker build -f apps/audio-node-app/Dockerfile -t "${AUDIO_NODE_IMAGE_NAME}:${GITHUB_SHA}" .
          docker build -f apps/stock-node-app/Dockerfile -t "${STOCK_NODE_IMAGE_NAME}:${GITHUB_SHA}" .
          docker build -f ops/youtube-cipher/Dockerfile -t "${YOUTUBE_CIPHER_IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Build Maple portal image
        if: ${{ vars.MAPLE_DISCORD_ENABLED == 'true' }}
        run: docker build -f apps/maple-portal/Dockerfile --target portal -t "${MAPLE_PORTAL_IMAGE_NAME}:${GITHUB_SHA}" apps/maple-portal

      - name: Save Docker images and checksums
        run: |
          mkdir -p out
          for image in "${GATEWAY_IMAGE_NAME}" "${AUDIO_NODE_IMAGE_NAME}" "${STOCK_NODE_IMAGE_NAME}" "${YOUTUBE_CIPHER_IMAGE_NAME}"; do
            docker save "${image}:${GITHUB_SHA}" | gzip > "out/${image}-${GITHUB_SHA}.tar.gz"
          done
          if [[ "${{ vars.MAPLE_DISCORD_ENABLED }}" == "true" ]]; then
            docker save "${MAPLE_PORTAL_IMAGE_NAME}:${GITHUB_SHA}" | gzip > "out/${MAPLE_PORTAL_IMAGE_NAME}-${GITHUB_SHA}.tar.gz"
          fi
          cd out
          sha256sum *.tar.gz > SHA256SUMS

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="deploy-${GITHUB_SHA}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" out/*.tar.gz out/SHA256SUMS --clobber
          else
            gh release create "${tag}" out/*.tar.gz out/SHA256SUMS \
              --target "${GITHUB_SHA}" --title "DIS deployment ${GITHUB_SHA}" \
              --notes "Verified DIS Docker images for commit ${GITHUB_SHA}. No runtime secrets are included."
          fi
